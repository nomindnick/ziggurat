<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziggurat Draft Cockpit</title>
<style>
  :root {
    --bg: #12151a; --panel: #1b2028; --panel2: #222834; --line: #313a48;
    --fg: #e6ebf2; --dim: #8a94a6; --accent: #4da3ff; --good: #45c98b;
    --warn: #e8b64c; --bad: #e06c6c; --mine: #2b3b55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  #clock { font-size: 18px; font-weight: 700; }
  #clock.mine { color: var(--good); }
  #recal { color: var(--dim); font-size: 12px; }
  #journal { color: var(--dim); font-size: 11px; margin-left: auto; }
  main {
    display: grid; grid-template-columns: minmax(280px, 1fr) minmax(340px, 1.3fr) minmax(260px, 1fr);
    gap: 12px; padding: 12px 16px; align-items: start;
  }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }

  /* entry */
  #entrymode { min-height: 18px; font-size: 12px; color: var(--warn); margin-bottom: 4px; }
  #q {
    width: 100%; padding: 10px 12px; font-size: 17px; color: var(--fg);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #sugg { margin: 6px 0 0; padding: 0; list-style: none; }
  #sugg li {
    display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 6px; cursor: pointer;
  }
  #sugg li.hi { background: var(--mine); outline: 1px solid var(--accent); }
  #sugg .pos { color: var(--accent); font-weight: 600; width: 34px; }
  #sugg .team { color: var(--dim); width: 38px; }
  #sugg .rank { color: var(--dim); margin-left: auto; font-size: 12px; }
  #flash { min-height: 20px; font-size: 13px; margin-top: 6px; }
  #flash.ok { color: var(--good); } #flash.err { color: var(--bad); }

  /* log */
  #log { max-height: 44vh; overflow-y: auto; margin-top: 6px; }
  .pickrow { display: flex; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .pickrow:hover { background: var(--panel2); }
  .pickrow.mine { background: var(--mine); }
  .pickrow.editing { outline: 1px solid var(--warn); }
  .pickrow .ov { color: var(--dim); width: 34px; }
  .pickrow .seat { color: var(--dim); width: 52px; }
  .toolbar { display: flex; gap: 8px; margin-top: 8px; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b1017; border: none; font-weight: 700; }

  /* recommendation */
  #recpanel .top { font-size: 20px; font-weight: 700; }
  #recpanel .meta { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  #recpanel ul { margin: 6px 0; padding-left: 18px; }
  #recpanel li { margin: 3px 0; }
  .alt { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .altname { color: var(--fg); }
  #posture {
    display: none; margin-top: 10px; padding: 10px; border-radius: 6px;
    background: #3a3320; border: 1px solid var(--warn);
  }
  #contin { color: var(--dim); font-size: 13px; margin-top: 10px; }
  #proposal { display: none; margin-top: 10px; padding: 10px; border-radius: 6px;
              background: var(--panel2); border: 1px solid var(--line); }
  .notmyturn { color: var(--dim); }

  /* best available */
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  #tabs button.on { background: var(--accent); color: #0b1017; font-weight: 700; }
  #avail { max-height: 60vh; overflow-y: auto; font-size: 13px; }
  .avrow { display: flex; gap: 8px; padding: 3px 6px; }
  .avrow .vor { margin-left: auto; color: var(--good); }
  .avrow .rank { color: var(--dim); width: 44px; }
  #roster div { padding: 2px 0; font-size: 13px; }
  #roster .pos { color: var(--accent); font-weight: 600; display: inline-block; width: 40px; }
</style>
</head>
<body>
<header>
  <div id="clock">…</div>
  <div id="recal"></div>
  <div id="journal"></div>
</header>
<main>
  <section>
    <h2>Enter pick</h2>
    <div id="entrymode"></div>
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="type any chunk of a name — last, first, no punctuation needed">
    <ul id="sugg"></ul>
    <div id="flash"></div>
    <div class="toolbar">
      <button id="auto">Autodraft rival (a)</button>
      <button id="undo">Undo last</button>
    </div>
    <div id="proposal"></div>
    <h2 style="margin-top:14px">Pick log <span style="text-transform:none;color:var(--dim)">(click a row to edit it)</span></h2>
    <div id="log"></div>
  </section>

  <section id="recpanel">
    <h2>Recommendation</h2>
    <div id="rec"></div>
    <div id="contin"></div>
    <div id="posture">
      <div id="posturemsg"></div>
      <div class="toolbar">
        <button id="paccept" class="primary">Adopt this lean</button>
        <button id="pdismiss">Dismiss</button>
      </div>
    </div>
    <h2 style="margin-top:14px">My roster</h2>
    <div id="roster"></div>
  </section>

  <section>
    <h2>Best available (your scoring)</h2>
    <div id="tabs"></div>
    <div id="avail"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Defense-in-depth: DB-sourced strings (player names/teams) pass through esc()
// before any innerHTML interpolation. Not a live vector today (names come from
// nflverse/ESPN, reasons from the engine) — audit 2026-07-24 finding 6.
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let BOARD = [], TAKEN = new Set(), STATE = null;
let SUGG = [], HI = 0, EDITING = null, POS_TAB = "ALL";
const POSITIONS = ["ALL", "RB", "WR", "QB", "TE", "DST", "K"];

async function api(path, body) {
  const opts = body === undefined ? {} :
    { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function flash(msg, ok) {
  const f = $("flash");
  f.textContent = msg; f.className = ok ? "ok" : "err";
  if (ok) setTimeout(() => { if (f.textContent === msg) f.textContent = ""; }, 4000);
}

/* ---------------- state rendering ---------------- */
function seatLabel(seat) {
  return seat === STATE.operator_slot ? "YOU" : ("seat " + seat);
}
function renderState(s) {
  STATE = s;
  TAKEN = new Set(s.taken);
  const c = $("clock");
  if (s.complete) {
    c.textContent = "Draft complete — journal saved."; c.className = "";
  } else {
    c.textContent = `Pick ${s.overall_pick} · round ${s.round}/${s.rounds_total} · ${seatLabel(s.current_seat)} on the clock`;
    c.className = s.is_operator_turn ? "mine" : "";
  }
  $("recal").textContent = s.recal || "";
  $("journal").textContent = s.journal;

  // pick log (latest first)
  const log = $("log"); log.innerHTML = "";
  [...s.picks].reverse().forEach(p => {
    const d = document.createElement("div");
    d.className = "pickrow" + (p.seat === s.operator_slot ? " mine" : "")
      + (EDITING === p.overall ? " editing" : "");
    d.innerHTML = `<span class="ov">#${p.overall}</span><span class="seat">${seatLabel(p.seat)}</span><span>${esc(p.name || p.player_id)}</span>`;
    d.onclick = () => { EDITING = (EDITING === p.overall) ? null : p.overall; renderEditMode(); renderState(STATE); };
    log.appendChild(d);
  });

  // recommendation panel
  const rec = $("rec");
  if (s.complete) {
    rec.innerHTML = `<div class="notmyturn">Done. Resume anytime with --resume to review.</div>`;
  } else if (!s.is_operator_turn) {
    rec.innerHTML = `<div class="notmyturn">Clock is on ${seatLabel(s.current_seat)} — enter their pick on the left (or use Autodraft). Your recommendation appears the moment the clock reaches you.</div>`;
  } else if (!s.recs.length) {
    rec.innerHTML = `<div class="notmyturn">No recommendation available.</div>`;
  } else {
    const r = s.recs[0];
    const head = `<div class="top">${esc(r.name)} <span style="color:var(--accent)">${esc(r.position)}</span> ${esc(r.team || "")}</div>`;
    rec.innerHTML = head +
      `<div class="meta">pick score ${r.pick_score} · value (VOR) ${r.vor} · ${Math.round(r.survival_next*100)}% lasts to your next pick</div>` +
      `<ul>` + r.reasons.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>` +
      s.recs.slice(1, 3).map(a =>
        `<div class="alt">next: <span class="altname">${esc(a.name)}</span> (${esc(a.position)}, score ${a.pick_score})</div>`).join("");
  }
  $("contin").textContent = (s.contingencies || []).join("  ");
  $("posture").style.display = s.posture ? "block" : "none";
  $("posturemsg").textContent = s.posture || "";

  renderAvail();
  renderRoster(s);
}
function renderRoster(s) {
  const el = $("roster"); el.innerHTML = "";
  s.own_roster.forEach(e => {
    const d = document.createElement("div");
    d.innerHTML = `<span class="pos">${esc(e.position)}</span> ${esc(e.name)} <span style="color:var(--dim)">${esc(e.team || "")}</span>`;
    el.appendChild(d);
  });
  if (!s.own_roster.length) el.innerHTML = `<div class="notmyturn">No picks yet.</div>`;
}
function renderAvail() {
  const el = $("avail"); el.innerHTML = "";
  BOARD.filter(e => !TAKEN.has(e.player_id) && e.name &&
      (POS_TAB === "ALL" || e.position === POS_TAB))
    .sort((a, b) => b.vor - a.vor).slice(0, 40)
    .forEach(e => {
      const d = document.createElement("div"); d.className = "avrow";
      const rank = e.espn_rank >= 10000 ? "—" : ("ESPN " + e.espn_rank);
      d.innerHTML = `<span class="rank">${rank}</span><span>${esc(e.name)}</span>` +
        `<span style="color:var(--accent)">${esc(e.position)}</span><span class="vor">${e.vor}</span>`;
      el.appendChild(d);
    });
}
function renderTabs() {
  const t = $("tabs"); t.innerHTML = "";
  POSITIONS.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p; b.className = p === POS_TAB ? "on" : "";
    b.onclick = () => { POS_TAB = p; renderTabs(); renderAvail(); };
    t.appendChild(b);
  });
}
function renderEditMode() {
  $("entrymode").textContent = EDITING === null
    ? "" : `EDITING pick #${EDITING} — choose the correct player (Esc cancels)`;
}

/* ---------------- suggestions ---------------- */
let debounceTimer = null, reqSeq = 0;
function renderSugg() {
  const ul = $("sugg"); ul.innerHTML = "";
  SUGG.forEach((e, i) => {
    const li = document.createElement("li");
    li.className = i === HI ? "hi" : "";
    const rank = e.espn_rank >= 10000 ? "" : ("ESPN " + e.espn_rank);
    li.innerHTML = `<span class="pos">${esc(e.position)}</span><span>${esc(e.name)}</span>` +
      `<span class="team">${esc(e.team || "")}</span><span class="rank">${rank}</span>`;
    li.onmouseenter = () => { HI = i; renderSugg(); };
    li.onclick = () => commit(e);
    ul.appendChild(li);
  });
}
function fetchSugg() {
  const q = $("q").value.trim();
  // bump reqSeq even on empty so an in-flight response can't repopulate a
  // box the operator just cleared (audit finding 4)
  if (!q) { reqSeq++; SUGG = []; HI = 0; renderSugg(); return; }
  const seq = ++reqSeq;
  api("/api/suggest?q=" + encodeURIComponent(q)).then(list => {
    if (seq !== reqSeq) return;  // a newer keystroke's answer wins
    SUGG = list; HI = 0; renderSugg();
  }).catch(() => {});
}
async function commit(entry) {
  try {
    if (EDITING !== null) {
      await api("/api/edit", { overall: EDITING, player_id: entry.player_id });
      flash(`Edited pick #${EDITING} → ${entry.name}`, true);
      EDITING = null; renderEditMode();
    } else {
      // label from the SERVER's response — the page's own state can be stale
      // mid-burst (audit finding 5)
      const out = await api("/api/pick", { player_id: entry.player_id });
      flash(`Pick ${out.overall} (${seatLabel(out.seat)}): ${entry.name} ✓`, true);
    }
    $("q").value = ""; SUGG = []; HI = 0; renderSugg();
    hideProposal();
    await refresh();
  } catch (e) { flash(e.message, false); }
  $("q").focus();
}

/* ---------------- actions ---------------- */
function hideProposal() { $("proposal").style.display = "none"; $("proposal").innerHTML = ""; }
async function autodraft() {
  try {
    const j = await api("/api/autodraft", {});
    const p = j.proposal, el = $("proposal");
    el.style.display = "block";
    el.innerHTML = `Seat ${j.seat} autodraft proposal: <b>${esc(p.name)}</b> (${esc(p.position)}${p.team ? ", " + esc(p.team) : ""}) `;
    const b = document.createElement("button");
    b.className = "primary"; b.textContent = "Confirm";
    b.onclick = () => commit(p);
    el.appendChild(b);
  } catch (e) { flash(e.message, false); }
  $("q").focus();
}
async function undo() {
  try {
    await api("/api/undo", {});
    flash("Last pick undone.", true);
    hideProposal();
    EDITING = null; renderEditMode();  // an armed edit may now point past the tail (audit finding 7)
    await refresh();
  }
  catch (e) { flash(e.message, false); }
  $("q").focus();
}
async function postureAct(action) {
  try { await api("/api/posture", { action }); await refresh(); }
  catch (e) { flash(e.message, false); }
  $("q").focus();
}

/* ---------------- wiring ---------------- */
$("q").addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fetchSugg, 110);
});
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); if (SUGG.length) { HI = (HI + 1) % SUGG.length; renderSugg(); } }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); if (SUGG.length) { HI = (HI - 1 + SUGG.length) % SUGG.length; renderSugg(); } }
  else if (ev.key === "Enter") {
    ev.preventDefault();
    if (SUGG.length) commit(SUGG[HI]);   // commits the VISIBLE highlighted name
  }
  else if (ev.key === "Escape") {
    $("q").value = ""; SUGG = []; HI = 0; renderSugg();
    EDITING = null; renderEditMode(); hideProposal();
    if (STATE) renderState(STATE);
  }
});
$("auto").onclick = autodraft;
$("undo").onclick = undo;
$("paccept").onclick = () => postureAct("accept");
$("pdismiss").onclick = () => postureAct("dismiss");

async function refresh() {
  try { renderState(await api("/api/state")); } catch (e) { /* transient */ }
}
async function boot() {
  renderTabs();
  BOARD = await api("/api/board");
  await refresh();
  $("q").focus();
  setInterval(refresh, 1500);
}
boot();
</script>
</body>
</html>
