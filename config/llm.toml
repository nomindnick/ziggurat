# LLM task routing (SPEC key decision 13: model-tier routing with local optionality).
# Every programmatic model call in this repo goes through ziggurat.llm.Router,
# which resolves the task tag against this table. No component calls a model
# directly — backends are configuration, not code.
#
#   tier    = routine | standard | high_stakes
#             (stakes tagging from day one; drives backend assignment, e.g.
#              routine tasks move to a local Ollama model once the Phase 4.5
#              bake-off qualifies one)
#   backend = echo | claude_cli | anthropic_api | ollama
#             (see ziggurat/llm/backends.py — only `echo` is implemented in
#              Phase 0; the others are registered but raise until their phase)
#   model   = optional backend-specific model name

[tasks.smoke_test]
backend = "echo"
tier = "routine"

# --- item 3.6 push layer: the first live claude_cli tasks ---
# The scheduled Wednesday briefing prose: standard tier -> the stronger
# summarizer. One call per weekly briefing, so `sonnet` is affordable.
[tasks.morning_briefing]
backend = "claude_cli"
model = "sonnet"
tier = "standard"

# Per-alert / news blurb summarization: routine, high-volume (fires up to ~50x/day
# on the alert cadence), so `haiku` for speed and cost.
[tasks.news_summarization]
backend = "claude_cli"
model = "haiku"
tier = "routine"

# Real task tags land with their features, e.g.:
#   podcast_claim_extraction (4.3, routine)
#   trade_pitch_drafting     (5.3, standard)
#   <a future high-stakes task> would route backend = "anthropic_api" (metered) —
#   which is why claude_cli and anthropic_api stay distinct backends.
