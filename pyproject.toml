[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ziggurat"
version = "0.1.0"
description = "AI-assisted decision system for a season-long fantasy football league — Claude Code as the agentic harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    # Draft-board TUI (item 2.4) render layer. Declared directly rather than leaning
    # on typer's transitive pull; DELETABLE with ziggurat/draft/ — remove this one
    # line when the draft package is deleted after draft day (Rule 8).
    "rich>=13",
    "espn_api>=0.46",  # ESPN private-league access (spike 1.1)
    # Maintained nflverse client; replaces deprecated nfl_data_py.
    "nflreadpy>=0.1.5,<0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",  # nflreadpy Polars -> pandas conversion + test fixtures
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
ziggurat = "ziggurat.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ziggurat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
