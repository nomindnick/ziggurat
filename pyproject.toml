[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ziggurat"
version = "0.1.0"
description = "AI-assisted decision system for a season-long fantasy football league — Claude Code as the agentic harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "espn_api>=0.46",  # ESPN private-league access (spike 1.1); reads host is lm-api-reads.fantasy.espn.com
    # --- NFL data stack (item 1.4) ---
    # nfl_data_py is installed SEPARATELY with --no-deps (see CLAUDE.md dev
    # workflow): its released metadata pins pandas<2 / numpy<2, which have no
    # cp312 wheels, but it runs fine on modern pandas. We therefore declare its
    # real runtime deps here so `pip install -e '.[dev]'` provisions them.
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",           # parquet: nflverse release files + test fixtures
    "appdirs>=1.4",          # nfl_data_py cache dir
    "python-dateutil>=2.8",  # nfl_data_py
    "requests>=2.28",        # nfl_data_py
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ziggurat = "ziggurat.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ziggurat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
