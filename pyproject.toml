[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ziggurat"
version = "0.1.0"
description = "AI-assisted decision system for a season-long fantasy football league — Claude Code as the agentic harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "espn_api>=0.46",  # ESPN private-league access (spike 1.1); reads host is lm-api-reads.fantasy.espn.com
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ziggurat = "ziggurat.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["ziggurat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
